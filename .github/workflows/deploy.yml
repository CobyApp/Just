name: Deploy to TestFlight

on:
  # The primary release trigger: push a vX.Y.Z tag.
  push:
    tags:
      - 'v*'
  # Manual run from the Actions tab, without a tag.
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Optional build number override (defaults to latest TestFlight build + 1)'
        required: false
      marketing_version:
        description: 'Optional marketing version, e.g. 1.2.0 (tag pushes take it from the tag)'
        required: false
  # Called by release.yml after it has created the tag, so a token-pushed tag
  # (which cannot trigger `on: push`) still deploys.
  workflow_call:
    inputs:
      marketing_version:
        type: string
        required: false

concurrency:
  group: appstore-deploy
  cancel-in-progress: false

jobs:
  # The same suite as every push; a failing test stops the upload.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - name: Setup Ruby + Bundler
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Stub local env file
        run: touch .env

      - name: Install Tuist via mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Stage App Store Connect API key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$APPSTORE_PRIVATE_KEY" > "$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          echo "AUTH_KEY_PATH=$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8" >> "$GITHUB_ENV"

      # Only an explicit override is exported. Without one, fastlane asks
      # TestFlight for the latest build number and adds one — the run number
      # restarts per workflow and would collide with builds uploaded before.
      #
      # `inputs.*` covers both workflow_dispatch and workflow_call; a tag push
      # takes the marketing version from the tag name.
      - name: Resolve build and marketing version
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          INPUT_MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            echo "BUILD_NUMBER=$INPUT_BUILD_NUMBER" >> "$GITHUB_ENV"
          fi
          if [ -n "$INPUT_MARKETING_VERSION" ]; then
            echo "TUIST_MARKETING_VERSION=$INPUT_MARKETING_VERSION" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "TUIST_MARKETING_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      # `fastlane beta` runs `tuist generate`, which bakes these into
      # Info.plist; the lane refuses to build if any is missing or still a
      # Google test id.
      - name: Deploy to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TUIST_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: bundle exec fastlane beta

      # A release entry for the tag, with notes generated from the commits since
      # the previous tag. Only on a real tag push — when release.yml calls this
      # workflow it creates the release itself, so this would double it.
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --latest \
              --verify-tag
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f "$AUTH_KEY_PATH" || true
