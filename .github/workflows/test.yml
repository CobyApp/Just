name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by deploy.yml, so nothing reaches TestFlight without passing first.
  workflow_call:

concurrency:
  # github.workflow is the caller's name when deploy.yml calls this, so a
  # push to main cannot cancel the test run a deploy is waiting on.
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned rather than macos-latest / latest-stable, so a runner image
    # update cannot change the toolchain under a green build. Keep in step
    # with the Xcode version the README names.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      # `.mise.toml` loads `.env` for local secrets; CI has none, so an empty
      # file stands in rather than relying on how mise treats a missing one.
      - name: Stub local env file
        run: touch .env

      - name: Install Tuist via mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate project
        run: bash Scripts/setup.sh

      - name: Test
        run: |
          set -o pipefail
          xcodebuild -workspace Just.xcworkspace -scheme Just \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -configuration Debug test | xcbeautify
